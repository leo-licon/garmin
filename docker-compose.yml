services:
  garmin-sync:
    build: .
    container_name: garmin_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mapea la carpeta 'out' de tu servidor a la carpeta 'out' que espera la app dentro del contenedor
      - ./out:/app/out
      - ./instance:/app/instance
    environment:
      - TZ=America/Chihuahua
      - SOCKETIO_ASYNC_MODE=gevent
      - GARTH_HOME=/app/out/data/garmin_tokens
